services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: algorithms
      POSTGRES_DB: CEITMETAVERSE
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:algorithms@db:5432/CEITMETAVERSE
      JWT_SECRET: ${JWT_SECRET:-change_me_secret}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-}
      PORT: 5000
      NODE_ENV: production
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/app/uploads

volumes:
  db_data:
