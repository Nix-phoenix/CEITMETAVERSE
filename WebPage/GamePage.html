<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="api-base" content="https://everyday-lead-precisely-buf.trycloudflare.com">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>Game Ã¢â‚¬â€ CEIT METAVERSE AND GAME</title>
    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        * { scrollbar-width: thin; scrollbar-color: #2c2c2e #111; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #3a3a3c; border-radius: 4px; }
        .nav-blur { backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); }
        .btn-primary { background: #0071e3; transition: background 0.2s ease; }
        .btn-primary:hover { background: #0077ed; }
        @keyframes spin-ring { to { transform: rotate(360deg); } }
        .spin-ring { animation: spin-ring 1s linear infinite; }
    </style>
</head>

<body class="bg-black text-[#f5f5f7] min-h-screen">

    <!-- Navigation -->
    <nav class="w-full nav-blur bg-black/80 border-b border-white/[0.06] px-6 h-14 flex items-center justify-between sticky top-0 z-40">
        <div class="flex items-center gap-8">
            <a href="HomePage.html" class="hover:opacity-75 transition-opacity duration-200">
                <div class="hidden sm:block">
                    <img src="../Image/logo.png" alt="CEIT" class="h-7 w-auto" />
                </div>
                <span class="text-sm font-semibold sm:hidden">CMG</span>
            </a>
            <div class="hidden md:flex items-center gap-6">
                <a href="HomePage.html" class="text-sm font-medium text-[#86868b] hover:text-[#f5f5f7] transition-colors">Home</a>
                <a href="Catagory.html" class="text-sm font-medium text-[#86868b] hover:text-[#f5f5f7] transition-colors">Catalog</a>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <a href="Catagory.html" class="text-sm text-[#86868b] hover:text-[#f5f5f7] transition-colors hidden sm:block"> Back to Catalog</a>
            <a href="Profile.html" class="w-8 h-8 rounded-full bg-[#1c1c1e] border border-white/[0.1] hover:bg-[#2c2c2e] flex items-center justify-center transition-colors">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="max-w-screen-xl mx-auto px-4 py-6">

        <!-- Top Section: Info + Game -->
        <div class="grid grid-cols-1 lg:grid-cols-5 gap-5 mb-5">

            <!-- Left: Game Info Panel -->
            <div class="lg:col-span-2 flex flex-col gap-4">

                <!-- Title Card -->
                <div class="bg-[#1c1c1e] border border-white/[0.08] rounded-2xl p-5">
                    <h1 id="gameTitle" class="text-2xl font-bold tracking-tight text-[#f5f5f7] mb-2">Loading...</h1>
                    <span id="gameType" class="inline-block bg-[#0071e3]/20 text-[#0071e3] text-xs font-medium px-3 py-1 rounded-full">Type</span>
                </div>

                <!-- Description -->
                <div class="bg-[#1c1c1e] border border-white/[0.08] rounded-2xl p-5 flex-1">
                    <p class="text-xs font-semibold text-[#86868b] uppercase tracking-widest mb-2">About This Game</p>
                    <p id="gameDescription" class="text-[#86868b] leading-relaxed text-sm">Loading description...</p>
                    <div class="mt-4">
                        <p class="text-xs font-semibold text-[#86868b] uppercase tracking-widest mb-2">Tags</p>
                        <div id="gameTags" class="flex flex-wrap gap-2"></div>
                    </div>
                </div>

                <!-- Stats -->
                <div class="grid grid-cols-3 gap-3">
                    <div class="bg-[#1c1c1e] border border-white/[0.08] rounded-xl p-4 text-center">
                        <p id="playCount" class="text-xl font-bold text-[#0071e3]">0</p>
                        <p class="text-xs text-[#86868b] mt-1">Plays</p>
                    </div>
                    <div class="bg-[#1c1c1e] border border-white/[0.08] rounded-xl p-4 text-center">
                        <p id="commentCount" class="text-xl font-bold text-[#32d74b]">0</p>
                        <p class="text-xs text-[#86868b] mt-1">Comments</p>
                    </div>
                    <div class="bg-[#1c1c1e] border border-white/[0.08] rounded-xl p-4 text-center">
                        <p id="favoriteCount" class="text-xl font-bold text-[#ff453a]">0</p>
                        <p class="text-xs text-[#86868b] mt-1">Favorites</p>
                    </div>
                </div>

                <!-- Hidden creator fields (kept for JS compatibility) -->
                <div class="hidden">
                    <div id="creatorPicture"></div>
                    <p id="creatorName"></p>
                    <p id="creatorUsername"></p>
                    <p id="uploadedDate"></p>
                </div>

                <a href="Catagory.html" class="w-full bg-[#1c1c1e] border border-white/[0.08] hover:bg-[#2c2c2e] text-[#86868b] hover:text-[#f5f5f7] px-4 py-3 rounded-full font-medium transition-colors text-center text-sm">
                    Back to Catalog
                </a>
            </div>

            <!-- Right: Game Iframe -->
            <div class="lg:col-span-3">
                <div class="bg-[#111] border border-white/[0.06] rounded-2xl overflow-hidden relative" style="height: 560px;">
                    <div id="gameLoading" class="absolute inset-0 flex flex-col items-center justify-center bg-[#111] z-10">
                        <div class="w-12 h-12 border-2 border-white/[0.06] border-t-[#0071e3] rounded-full spin-ring mb-4"></div>
                        <p class="text-[#f5f5f7] font-medium text-sm">Loading game...</p>
                        <p class="text-[#86868b] text-xs mt-1">Unity WebGL may take a moment</p>
                    </div>
                    <iframe id="gameFrame" src=""
                        class="w-full h-full border-none"
                        allow="fullscreen; autoplay"
                        onload="document.getElementById('gameLoading').style.display='none'"
                    ></iframe>
                    <button onclick="toggleFullscreen()"
                        class="absolute bottom-3 right-3 bg-black/70 hover:bg-black/90 text-[#f5f5f7] text-xs px-3 py-1.5 rounded-lg z-20 transition"
                        title="Fullscreen">
                        Fullscreen
                    </button>
                </div>
            </div>
        </div>

        <!-- Comment Section -->
        <div class="bg-[#1c1c1e] border border-white/[0.08] rounded-2xl p-6">
            <h3 class="text-base font-semibold text-[#f5f5f7] mb-5">Comments</h3>
            <div class="flex gap-3 mb-5">
                <div class="w-8 h-8 rounded-full bg-[#2c2c2e] border border-white/[0.08] flex items-center justify-center flex-shrink-0 mt-1">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#86868b" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </div>
                <div class="flex-1">
                    <textarea id="commentInput"
                        placeholder="Share your thoughts..."
                        class="w-full bg-[#2c2c2e] border border-white/[0.08] rounded-xl px-4 py-3 text-sm text-[#f5f5f7] placeholder-[#86868b] focus:outline-none focus:ring-1 focus:ring-[#0071e3] transition resize-none"
                        rows="2"></textarea>
                    <div class="flex justify-end mt-2">
                        <button onclick="addComment()" class="btn-primary text-white text-sm font-medium px-5 py-2 rounded-full transition">
                            Post
                        </button>
                    </div>
                </div>
            </div>
            <div id="commentsSection" class="space-y-3 max-h-72 overflow-y-auto">
                <div class="text-center py-8">
                    <p class="text-[#86868b] text-sm">No comments yet. Be the first!</p>
                </div>
            </div>
        </div>

    </div>

    <script src="api-config.js"></script>
    <script src="ui-utils.js"></script>
    <script>
        let selectedGame = null;
        let creatorInfo = null;

        async function loadGameData() {
            const cachedGame = sessionStorage.getItem('selectedGame');
            const gameId = sessionStorage.getItem('selectedGameId');

            if (cachedGame) {
                selectedGame = JSON.parse(cachedGame);
                displayGameInfo();
                loadGameInFrame();
                fetchCreatorInfo();
            } else if (gameId) {
                try {
                    const result = await apiCall(API_ENDPOINTS.gameById(gameId));
                    selectedGame = result.id ? result : null;
                    if (selectedGame) {
                        displayGameInfo();
                        loadGameInFrame();
                        fetchCreatorInfo();
                    } else {
                        document.body.innerHTML = '<p class="text-red-500 text-center mt-10">Game not found. <a href="Catagory.html" class="text-blue-400">Go back to catalog</a></p>';
                    }
                } catch (err) {
                    document.body.innerHTML = '<p class="text-red-500 text-center mt-10">Game not found. <a href="Catagory.html" class="text-blue-400">Go back to catalog</a></p>';
                }
            } else {
                document.body.innerHTML = '<p class="text-red-500 text-center mt-10">No game selected. <a href="Catagory.html" class="text-blue-400">Go back to catalog</a></p>';
            }
        }

        async function fetchCreatorInfo() {
            try {
                if (selectedGame.creatorId) {
                    const endpoint = API_ENDPOINTS.userProfile(selectedGame.creatorId);
                    const result = await apiCall(endpoint);
                    if (result && result.id) {
                        creatorInfo = result;
                        displayCreatorInfo();
                    }
                }
            } catch (err) {
                console.error("Error fetching creator info:", err);
            }
        }

        function displayCreatorInfo() {
            if (creatorInfo) {
                document.getElementById('creatorName').textContent = creatorInfo.fullName || 'Unknown Developer';
                document.getElementById('creatorUsername').textContent = `@${creatorInfo.username || 'unknown'}`;
                const uploadDate = new Date(selectedGame.createdAt);
                const formattedDate = uploadDate.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
                document.getElementById('uploadedDate').textContent = `Uploaded: ${formattedDate}`;
                if (creatorInfo.profilePicture) {
                    const img = document.createElement('img');
                    img.src = creatorInfo.profilePicture;
                    img.alt = creatorInfo.fullName;
                    img.className = 'w-10 h-10 rounded-full object-cover';
                    document.getElementById('creatorPicture').innerHTML = '';
                    document.getElementById('creatorPicture').appendChild(img);
                }
            }
        }

        function viewDeveloperProfile() {
            if (creatorInfo) {
                sessionStorage.setItem('viewingUserId', creatorInfo.id);
                window.location.href = 'Profile.html';
            } else {
                alert('Developer information not available');
            }
        }

        function displayGameInfo() {
            document.getElementById('gameTitle').textContent = selectedGame.title;
            document.getElementById('gameType').textContent = selectedGame.gameType || 'Game';
            document.getElementById('gameDescription').textContent = selectedGame.fullDesc || selectedGame.shortDesc || 'No description available';
            
            const tagsContainer = document.getElementById('gameTags');
            tagsContainer.innerHTML = '';
            if (selectedGame.tags && selectedGame.tags.length > 0) {
                selectedGame.tags.forEach(tag => {
                    const tagEl = document.createElement('span');
                    tagEl.className = 'bg-[#2c2c2e] text-[#86868b] px-2 py-0.5 rounded-full text-xs';
                    tagEl.textContent = tag;
                    tagsContainer.appendChild(tagEl);
                });
            } else {
                tagsContainer.innerHTML = '<span class="text-gray-500 text-xs">No tags</span>';
            }
        }

        function loadGameInFrame() {
            const gameFrame = document.getElementById('gameFrame');
            if (selectedGame && selectedGame.id) {
                const gameURL = `${API_CONFIG.baseURL}/play/${selectedGame.id}`;
                gameFrame.src = gameURL;
                console.log('Loading Unity game from:', gameURL);
            } else {
                document.getElementById('gameLoading').innerHTML = '<p class="text-gray-400 p-4">Game file not found</p>';
            }
        }

        function toggleFullscreen() {
            const gameFrame = document.getElementById('gameFrame');
            if (gameFrame.requestFullscreen) {
                gameFrame.requestFullscreen();
            } else if (gameFrame.webkitRequestFullscreen) {
                gameFrame.webkitRequestFullscreen();
            }
        }

        function addComment() {
            const commentInput = document.getElementById('commentInput');
            const commentText = commentInput.value.trim();
            
            if (commentText) {
                const commentsSection = document.getElementById('commentsSection');
                
                if (commentsSection.querySelector('.text-center')) {
                    commentsSection.innerHTML = '';
                }

                const username = sessionStorage.getItem('username') || 'Anonymous';
                const commentEl = document.createElement('div');
                commentEl.className = 'flex gap-3 p-4 bg-[#2c2c2e] rounded-xl';
                commentEl.innerHTML = `
                    <div class="w-8 h-8 rounded-full bg-[#1c1c1e] border border-white/[0.08] flex items-center justify-center flex-shrink-0">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#86868b" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    </div>
                    <div class="flex-1">
                        <div class="flex items-center gap-2 mb-1">
                            <p class="font-medium text-[#0071e3] text-sm">${username}</p>
                            <span class="text-[#86868b] text-xs">Just now</span>
                        </div>
                        <p class="text-[#f5f5f7] text-sm">${commentText}</p>
                    </div>
                `;
                commentsSection.prepend(commentEl);
                
                const commentCount = parseInt(document.getElementById('commentCount').textContent) + 1;
                document.getElementById('commentCount').textContent = commentCount;
                
                commentInput.value = '';
            }
        }

        document.getElementById('commentInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) addComment();
        });

        // Load game data on page load
        loadGameData();
    </script>

</body>

</html>
