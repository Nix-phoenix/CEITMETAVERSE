<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>Sign In — CEIT METAVERSE AND GAME</title>
    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        * { scrollbar-width: thin; scrollbar-color: #2c2c2e #111; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #3a3a3c; border-radius: 4px; }
        .nav-blur { backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); }
        .btn-primary { background: #0071e3; transition: background 0.2s ease, transform 0.1s ease; }
        .btn-primary:hover { background: #0077ed; }
        .btn-primary:active { transform: scale(0.98); }
        input:-webkit-autofill { -webkit-box-shadow: 0 0 0 1000px #2c2c2e inset; -webkit-text-fill-color: #f5f5f7; }
    </style>
</head>
<body class="bg-black text-[#f5f5f7] min-h-screen flex flex-col">
    
    <!-- Navigation -->
    <nav class="w-full nav-blur bg-black/80 border-b border-white/[0.06] px-6 h-14 flex items-center justify-between sticky top-0 z-40">
        <div class="max-w-7xl w-full mx-auto flex items-center justify-between">
            <a href="HomePage.html" class="hover:opacity-75 transition-opacity duration-200">
                <div class="hidden sm:block">
                    <img src="../Image/Metaverse&Game_Logo(Final).png" alt="CEIT" class="h-7 w-auto" />
                </div>
                <span class="text-sm font-semibold sm:hidden">CMG</span>
            </a>
            <a href="HomePage.html" class="text-sm text-[#86868b] hover:text-[#f5f5f7] transition-colors">← Back to Home</a>
        </div>
    </nav>

    <!-- Login Container -->
    <div class="flex-1 flex items-center justify-center px-4 py-16">
        <div class="w-full max-w-sm">
            <div class="text-center mb-8">
                <div class="bg-white inline-block rounded-2xl px-4 py-2 mb-5">
                    <img src="../Image/Metaverse&Game_Logo(Final).png" alt="CEIT" class="h-8 w-auto" />
                </div>
                <h1 class="text-2xl font-bold tracking-tight text-[#f5f5f7] mb-1">Welcome back</h1>
                <p class="text-sm text-[#86868b]">Sign in to your account</p>
            </div>

            <div class="bg-[#1c1c1e] border border-white/[0.08] rounded-3xl p-7 shadow-2xl shadow-black">
                <form id="loginForm" class="space-y-4">
                    <div>
                        <label for="email" class="block text-xs font-medium text-[#86868b] mb-1.5">Email</label>
                        <input id="email" type="email" placeholder="you@example.com" required
                            class="w-full bg-[#2c2c2e] border border-white/[0.08] rounded-xl px-4 py-2.5 text-sm text-[#f5f5f7] outline-none focus:ring-1 focus:ring-[#0071e3] focus:border-[#0071e3] transition placeholder-[#86868b]" />
                    </div>
                    <div>
                        <label for="password" class="block text-xs font-medium text-[#86868b] mb-1.5">Password</label>
                        <div class="relative">
                            <input id="password" type="password" placeholder="••••••••" required
                                class="w-full bg-[#2c2c2e] border border-white/[0.08] rounded-xl px-4 py-2.5 text-sm text-[#f5f5f7] outline-none focus:ring-1 focus:ring-[#0071e3] focus:border-[#0071e3] transition placeholder-[#86868b]" />
                            <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-2.5 text-[#86868b] hover:text-[#f5f5f7] transition-colors">
                                <svg id="eyeIconOpen" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                <svg id="eyeIconClosed" class="hidden" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                            </button>
                        </div>
                    </div>
                    <div class="flex items-center justify-between pt-1">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" id="rememberMe" class="w-3.5 h-3.5 rounded accent-[#0071e3]" />
                            <span class="text-xs text-[#86868b]">Remember me</span>
                        </label>
                        <a href="#" class="text-xs text-[#0071e3] hover:opacity-80 transition-opacity">Forgot password?</a>
                    </div>

                    <div id="errorMessage" class="hidden bg-[#ff453a]/10 border border-[#ff453a]/20 text-[#ff453a] px-4 py-3 rounded-xl text-xs">
                        <span id="errorText"></span>
                    </div>
                    <div id="successMessage" class="hidden bg-[#32d74b]/10 border border-[#32d74b]/20 text-[#32d74b] px-4 py-3 rounded-xl text-xs">
                        <span id="successText">Login successful! Redirecting...</span>
                    </div>

                    <button type="submit" id="loginBtn"
                        class="w-full btn-primary text-white py-2.5 rounded-full font-medium text-sm mt-1 flex items-center justify-center gap-2">
                        <span id="btnText">Sign In</span>
                    </button>
                </form>

                <div class="relative my-5">
                    <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-white/[0.06]"></div></div>
                    <div class="relative flex justify-center"><span class="px-3 bg-[#1c1c1e] text-[#86868b] text-xs">or</span></div>
                </div>

                <div class="space-y-2">
                    <button type="button" disabled class="w-full bg-[#2c2c2e] border border-white/[0.06] rounded-xl px-4 py-2.5 text-sm text-[#86868b] opacity-50 cursor-not-allowed">Continue with Facebook</button>
                    <button type="button" disabled class="w-full bg-[#2c2c2e] border border-white/[0.06] rounded-xl px-4 py-2.5 text-sm text-[#86868b] opacity-50 cursor-not-allowed">Continue with Google</button>
                </div>

                <p class="text-center text-xs text-[#86868b] mt-5">
                    Don't have an account? <a href="SignInPage.html" class="text-[#0071e3] hover:opacity-80 transition-opacity font-medium">Create one</a>
                </p>
            </div>

            <p class="text-center mt-6 text-[#86868b] text-xs leading-relaxed">
                Protected by reCAPTCHA &middot;
                <a href="#" class="hover:text-[#f5f5f7] transition-colors">Privacy</a> &middot;
                <a href="#" class="hover:text-[#f5f5f7] transition-colors">Terms</a>
            </p>
        </div>
    </div>

    <script src="api-config.js"></script>
    <script src="ui-utils.js"></script>
    <script>
        // ============================================
        // Configuration - Using centralized API configuration from api-config.js
        // Using UI utilities from ui-utils.js
        // ============================================

        // ============================================
        // Password Visibility Toggle
        // ============================================
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            
            const passwordInput = document.getElementById('password');
            const eyeOpen = document.getElementById('eyeIconOpen');
            const eyeClosed = document.getElementById('eyeIconClosed');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeOpen.classList.add('hidden');
                eyeClosed.classList.remove('hidden');
            } else {
                passwordInput.type = 'password';
                eyeOpen.classList.remove('hidden');
                eyeClosed.classList.add('hidden');
            }
        }

        // ============================================
        // Show Messages (using ui-utils)
        // ============================================
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            if (errorDiv && errorText) {
                errorText.textContent = message;
                errorDiv.classList.remove('hidden');
                
                const successDiv = document.getElementById('successMessage');
                if (successDiv) successDiv.classList.add('hidden');
            }
            showToast(message, 'error');
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            const successText = document.getElementById('successText');
            if (successDiv && successText) {
                successText.textContent = message;
                successDiv.classList.remove('hidden');
                
                const errorDiv = document.getElementById('errorMessage');
                if (errorDiv) errorDiv.classList.add('hidden');
            }
            showToast(message, 'success');
        }

        // ============================================
        // Handle Login Form Submission
        // ============================================
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            const loginBtn = document.getElementById('loginBtn');
            const emailField = document.getElementById('email');
            const passwordField = document.getElementById('password');

            // Clear previous errors
            clearFieldError(emailField);
            clearFieldError(passwordField);

            // Validate form
            if (!email || !password) {
                showError('Please fill in all fields');
                if (!email) showFieldError(emailField, 'Email is required');
                if (!password) showFieldError(passwordField, 'Password is required');
                return;
            }

            if (!validateEmail(email)) {
                showError('Please enter a valid email address');
                showFieldError(emailField, 'Invalid email format');
                return;
            }

            if (password.length < 6) {
                showError('Password must be at least 6 characters');
                showFieldError(passwordField, 'Password too short');
                return;
            }

            // Show loading state
            setButtonLoading(loginBtn, 'Signing in...');

            try {
                console.log('Login attempt:', email);

                const result = await apiCall(API_ENDPOINTS.login, {
                    method: 'POST',
                    body: { email, password }
                });

                if (result.token) {
                    showSuccess('Login successful! Redirecting...');

                    // Store user data in sessionStorage
                    sessionStorage.setItem('authToken', result.token);
                    sessionStorage.setItem('userId', result.userId);
                    sessionStorage.setItem('username', result.username || 'User');
                    sessionStorage.setItem('fullName', result.fullName || result.username || 'User');
                    sessionStorage.setItem('email', email);
                    sessionStorage.setItem('justLoggedIn', 'true'); // Flag for welcome message

                    // Store in localStorage if remember me is checked
                    if (rememberMe) {
                        localStorage.setItem('rememberedEmail', email);
                    } else {
                        localStorage.removeItem('rememberedEmail');
                    }

                    // Redirect after 1 second
                    navigateTo('HomePage.html', 1000);
                } else {
                    showError(result.error || 'Invalid email or password');
                    resetButton(loginBtn);
                }
            } catch (err) {
                console.error('Login error:', err);
                showError(err.data?.error || 'Invalid email or password');
                resetButton(loginBtn);
            }
        });

        // ============================================
        // Load Remembered Email
        // ============================================
        window.addEventListener('load', () => {
            // Check if already logged in
            if (sessionStorage.getItem('authToken')) {
                showToast('You are already logged in', 'info');
                navigateTo('HomePage.html', 1500);
                return;
            }

            const rememberedEmail = localStorage.getItem('rememberedEmail');
            if (rememberedEmail) {
                document.getElementById('email').value = rememberedEmail;
                document.getElementById('rememberMe').checked = true;
            }
        });
    </script>

</body>
</html>
