<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>Create Account — CEIT METAVERSE AND GAME</title>
    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        * { scrollbar-width: thin; scrollbar-color: #2c2c2e #111; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #3a3a3c; border-radius: 4px; }
        .nav-blur { backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); }
        .btn-primary { background: #0071e3; transition: background 0.2s ease, transform 0.1s ease; }
        .btn-primary:hover { background: #0077ed; }
        .btn-primary:active { transform: scale(0.98); }
        input:-webkit-autofill { -webkit-box-shadow: 0 0 0 1000px #2c2c2e inset; -webkit-text-fill-color: #f5f5f7; }
    </style>
</head>
<body class="bg-black text-[#f5f5f7] min-h-screen flex flex-col">

    <!-- Navigation -->
    <nav class="w-full nav-blur bg-black/80 border-b border-white/[0.06] px-6 h-14 flex items-center sticky top-0 z-40">
        <div class="max-w-7xl w-full mx-auto flex items-center justify-between">
            <a href="HomePage.html" class="hover:opacity-75 transition-opacity duration-200">
                <div class="hidden sm:block">
                    <img src="../Image/Metaverse&Game_Logo(Final).png" alt="CEIT" class="h-7 w-auto" />
                </div>
                <span class="text-sm font-semibold sm:hidden">CMG</span>
            </a>
            <a href="HomePage.html" class="text-sm text-[#86868b] hover:text-[#f5f5f7] transition-colors">← Back to Home</a>
        </div>
    </nav>

    <!-- Sign Up Container -->
    <div class="flex-1 flex items-center justify-center px-4 py-12">
        <div class="w-full max-w-sm">
            <div class="text-center mb-8">
                <div class="bg-white inline-block rounded-2xl px-4 py-2 mb-5">
                    <img src="../Image/Metaverse&Game_Logo(Final).png" alt="CEIT" class="h-8 w-auto" />
                </div>
                <h1 class="text-2xl font-bold tracking-tight text-[#f5f5f7] mb-1">Create your account</h1>
                <p class="text-sm text-[#86868b]">Join CEIT METAVERSE AND GAME</p>
            </div>

            <div class="bg-[#1c1c1e] border border-white/[0.08] rounded-3xl p-7 shadow-2xl shadow-black">
                <form id="signUpForm" class="space-y-4">
                    <div>
                        <label for="fullName" class="block text-xs font-medium text-[#86868b] mb-1.5">Full Name</label>
                        <input id="fullName" type="text" placeholder="Your full name" required
                            class="w-full bg-[#2c2c2e] border border-white/[0.08] rounded-xl px-4 py-2.5 text-sm text-[#f5f5f7] outline-none focus:ring-1 focus:ring-[#0071e3] focus:border-[#0071e3] transition placeholder-[#86868b]" />
                    </div>
                    <div>
                        <label for="email" class="block text-xs font-medium text-[#86868b] mb-1.5">Email</label>
                        <input id="email" type="email" placeholder="you@example.com" required
                            class="w-full bg-[#2c2c2e] border border-white/[0.08] rounded-xl px-4 py-2.5 text-sm text-[#f5f5f7] outline-none focus:ring-1 focus:ring-[#0071e3] focus:border-[#0071e3] transition placeholder-[#86868b]" />
                        <p id="emailError" class="text-[#ff453a] text-xs mt-1 hidden">Email already exists</p>
                    </div>
                    <div>
                        <label for="username" class="block text-xs font-medium text-[#86868b] mb-1.5">Username</label>
                        <input id="username" type="text" placeholder="Choose a username" required
                            class="w-full bg-[#2c2c2e] border border-white/[0.08] rounded-xl px-4 py-2.5 text-sm text-[#f5f5f7] outline-none focus:ring-1 focus:ring-[#0071e3] focus:border-[#0071e3] transition placeholder-[#86868b]" />
                        <p class="text-[#86868b] text-xs mt-1">3–20 characters, letters and numbers only</p>
                    </div>
                    <div>
                        <label for="password" class="block text-xs font-medium text-[#86868b] mb-1.5">Password</label>
                        <div class="relative">
                            <input id="password" type="password" placeholder="Create a strong password" required
                                class="w-full bg-[#2c2c2e] border border-white/[0.08] rounded-xl px-4 py-2.5 text-sm text-[#f5f5f7] outline-none focus:ring-1 focus:ring-[#0071e3] focus:border-[#0071e3] transition placeholder-[#86868b] pr-16"
                                oninput="checkPasswordStrength()" />
                            <button type="button" onclick="togglePasswordVisibility('password')"
                                class="absolute right-3 top-2.5 text-xs text-[#86868b] hover:text-[#f5f5f7] transition-colors font-medium">
                                <span id="eyeIcon1">Show</span>
                            </button>
                        </div>
                        <div class="mt-2">
                            <div class="h-1 bg-[#2c2c2e] rounded-full overflow-hidden">
                                <div id="passwordStrengthBar" class="h-full w-0 bg-[#ff453a] rounded-full transition-all duration-300"></div>
                            </div>
                            <p id="passwordStrengthText" class="text-xs text-[#86868b] mt-1">Enter a password</p>
                        </div>
                    </div>
                    <div>
                        <label for="confirmPassword" class="block text-xs font-medium text-[#86868b] mb-1.5">Confirm Password</label>
                        <div class="relative">
                            <input id="confirmPassword" type="password" placeholder="Confirm your password" required
                                class="w-full bg-[#2c2c2e] border border-white/[0.08] rounded-xl px-4 py-2.5 text-sm text-[#f5f5f7] outline-none focus:ring-1 focus:ring-[#0071e3] focus:border-[#0071e3] transition placeholder-[#86868b] pr-16" />
                            <button type="button" onclick="togglePasswordVisibility('confirmPassword')"
                                class="absolute right-3 top-2.5 text-xs text-[#86868b] hover:text-[#f5f5f7] transition-colors font-medium">
                                <span id="eyeIcon2">Show</span>
                            </button>
                        </div>
                        <p id="passwordMatchError" class="text-[#ff453a] text-xs mt-1 hidden">Passwords do not match</p>
                    </div>
                    <div class="flex items-start gap-3 pt-1">
                        <input type="checkbox" id="termsAccept" required class="w-3.5 h-3.5 mt-0.5 rounded accent-[#0071e3]" />
                        <label for="termsAccept" class="text-xs text-[#86868b] cursor-pointer leading-relaxed">
                            I agree to the <a href="#" class="text-[#0071e3] hover:opacity-80">Terms of Service</a> and
                            <a href="#" class="text-[#0071e3] hover:opacity-80">Privacy Policy</a>
                        </label>
                    </div>

                    <div id="errorMessage" class="hidden bg-[#ff453a]/10 border border-[#ff453a]/20 text-[#ff453a] px-4 py-3 rounded-xl text-xs"></div>
                    <div id="successMessage" class="hidden bg-[#32d74b]/10 border border-[#32d74b]/20 text-[#32d74b] px-4 py-3 rounded-xl text-xs"></div>

                    <button type="submit" class="w-full btn-primary text-white font-medium py-2.5 px-4 rounded-full text-sm mt-1">
                        Create Account
                    </button>
                </form>

                <div class="relative my-5">
                    <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-white/[0.06]"></div></div>
                    <div class="relative flex justify-center"><span class="px-3 bg-[#1c1c1e] text-[#86868b] text-xs">or</span></div>
                </div>

                <div class="space-y-2">
                    <button type="button" disabled class="w-full bg-[#2c2c2e] border border-white/[0.06] rounded-xl px-4 py-2.5 text-sm text-[#86868b] opacity-50 cursor-not-allowed">Continue with Facebook</button>
                    <button type="button" disabled class="w-full bg-[#2c2c2e] border border-white/[0.06] rounded-xl px-4 py-2.5 text-sm text-[#86868b] opacity-50 cursor-not-allowed">Continue with Google</button>
                </div>

                <p class="text-center text-xs text-[#86868b] mt-5">
                    Already have an account? <a href="LogIn.html" class="text-[#0071e3] hover:opacity-80 font-medium">Sign in</a>
                </p>
            </div>
        </div>
    </div>

    <script src="api-config.js"></script>
    <script src="ui-utils.js"></script>
    <script>
        // Toggle password visibility
        function togglePasswordVisibility(fieldId) {
            const passwordInput = document.getElementById(fieldId);
            const eyeIcon = document.getElementById(fieldId === 'password' ? 'eyeIcon1' : 'eyeIcon2');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.textContent = 'Hide';
            } else {
                passwordInput.type = 'password';
                eyeIcon.textContent = 'Show';
            }
        }

        // Check password strength
        function checkPasswordStrength() {
            const password = document.getElementById('password').value;
            const strengthBar = document.getElementById('passwordStrengthBar');
            const strengthText = document.getElementById('passwordStrengthText');
            
            const result = validatePassword(password); // From ui-utils.js
            const strength = (result.score / 5) * 100;
            
            strengthBar.style.width = strength + '%';

            if (result.strength === 'weak') {
                strengthBar.className = 'h-full bg-red-600 transition-all';
                strengthText.textContent = 'Weak - ' + result.message;
                strengthText.className = 'text-xs text-red-400 mt-1';
            } else if (result.strength === 'medium') {
                strengthBar.className = 'h-full bg-yellow-600 transition-all';
                strengthText.textContent = 'Medium - Add more variety';
                strengthText.className = 'text-xs text-yellow-400 mt-1';
            } else {
                strengthBar.className = 'h-full bg-green-600 transition-all';
                strengthText.textContent = 'Strong - Great password!';
                strengthText.className = 'text-xs text-green-400 mt-1';
            }
        }

        // Validate username format
        function validateUsername(username) {
            return /^[a-zA-Z0-9]{3,20}$/.test(username);
        }

        // Handle sign up form submission
        document.getElementById('signUpForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const fullNameField = document.getElementById('fullName');
            const emailField = document.getElementById('email');
            const usernameField = document.getElementById('username');
            const passwordField = document.getElementById('password');
            const confirmPasswordField = document.getElementById('confirmPassword');
            const termsAccept = document.getElementById('termsAccept');
            const submitBtn = e.target.querySelector('button[type="submit"]');

            // Get values
            const fullName = fullNameField.value.trim();
            const email = emailField.value.trim();
            const username = usernameField.value.trim();
            const password = passwordField.value;
            const confirmPassword = confirmPasswordField.value;

            // Clear previous errors
            clearFieldError(fullNameField);
            clearFieldError(emailField);
            clearFieldError(usernameField);
            clearFieldError(passwordField);
            clearFieldError(confirmPasswordField);

            // Validation
            let hasError = false;

            if (!fullName) {
                showFieldError(fullNameField, 'Full name is required');
                hasError = true;
            }

            if (!email) {
                showFieldError(emailField, 'Email is required');
                hasError = true;
            } else if (!validateEmail(email)) {
                showFieldError(emailField, 'Please enter a valid email address');
                hasError = true;
            }

            if (!username) {
                showFieldError(usernameField, 'Username is required');
                hasError = true;
            } else if (!validateUsername(username)) {
                showFieldError(usernameField, '3-20 characters, letters and numbers only');
                hasError = true;
            }

            if (!password) {
                showFieldError(passwordField, 'Password is required');
                hasError = true;
            } else if (password.length < 8) {
                showFieldError(passwordField, 'Password must be at least 8 characters');
                hasError = true;
            }

            if (!confirmPassword) {
                showFieldError(confirmPasswordField, 'Please confirm your password');
                hasError = true;
            } else if (password !== confirmPassword) {
                showFieldError(confirmPasswordField, 'Passwords do not match');
                hasError = true;
            }

            if (!termsAccept.checked) {
                showToast('You must accept the terms and conditions', 'error');
                hasError = true;
            }

            if (hasError) {
                showToast('Please fix the errors in the form', 'error');
                return;
            }

            // Show loading state
            setButtonLoading(submitBtn, 'Creating Account...');

            try {
                // Send sign up request to server
                const result = await apiCall(API_ENDPOINTS.register, {
                    method: 'POST',
                    body: { fullName, email, username, password }
                });

                if (result.token || result.userId) {
                    showToast('Account created successfully!', 'success');

                    // Store email for login page
                    sessionStorage.setItem('registeredEmail', email);

                    // Redirect to login after 1.5 seconds
                    navigateTo('LogIn.html', 1500);
                } else {
                    showToast(result.error || 'Error creating account', 'error');
                    resetButton(submitBtn);
                }
            } catch (err) {
                console.error('Registration error:', err);
                const errMsg = err.data?.error || err.message || 'Registration failed';
                showToast(errMsg, 'error');
                if (errMsg.toLowerCase().includes('email')) {
                    showFieldError(emailField, 'This email is already registered');
                } else if (errMsg.toLowerCase().includes('username')) {
                    showFieldError(usernameField, 'This username is already taken');
                }
                resetButton(submitBtn);
            }
        });

        // Real-time validation
        document.getElementById('email').addEventListener('blur', function() {
            if (this.value && !validateEmail(this.value)) {
                showFieldError(this, 'Invalid email format');
            } else {
                clearFieldError(this);
            }
        });

        document.getElementById('username').addEventListener('blur', function() {
            if (this.value && !validateUsername(this.value)) {
                showFieldError(this, '3-20 characters, letters and numbers only');
            } else {
                clearFieldError(this);
            }
        });

        // Check password match on input
        document.getElementById('confirmPassword').addEventListener('input', function() {
            const password = document.getElementById('password').value;
            const confirmPassword = this.value;

            if (confirmPassword && password !== confirmPassword) {
                showFieldError(this, 'Passwords do not match');
            } else {
                clearFieldError(this);
            }
        });
    </script>

</body>
</html>
