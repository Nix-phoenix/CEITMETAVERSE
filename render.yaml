services:
  - type: web
    name: ceit-metaverse-backend
    runtime: node
    rootDir: Script/DataBase
    buildCommand: npm install && npx prisma generate
    startCommand: node sever.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
