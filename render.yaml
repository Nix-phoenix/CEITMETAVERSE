services:
  - type: web
    name: ceit-metaverse-backend
    runtime: node
    buildCommand: cd Script/DataBase && npm install && npx prisma generate --schema=./prisma/schema.prisma && npx prisma migrate deploy --schema=./prisma/schema.prisma
    startCommand: cd Script/DataBase && node sever.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false

  - type: static
    name: ceit-metaverse-frontend
    env: static
    staticPublishPath: WebPage
    buildCommand: echo "No build step for static frontend"
    envVars:
      - key: ALLOWED_ORIGIN
        value: https://ceitmetaverse-9.onrender.com
