databases:
  - name: ceitmetaverse-db
    databaseName: ceitmetaverse
    user: ceit
    plan: starter

services:
  - type: web
    name: ceitmetaverse-9
    branch: vresion-2.1
    runtime: node
    nodeVersion: 20.11.1
    buildCommand: cd Script/DataBase && npm ci && npx prisma generate --schema=./prisma/schema.prisma
    startCommand: cd Script/DataBase && npx prisma migrate deploy --schema=./prisma/schema.prisma && node sever.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ceitmetaverse-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGIN
        value: https://ceitmetaverse-9.onrender.com
      - key: GOOGLE_CLIENT_ID
        value: 749193197042-2ocl4nnvcgji9q2a1b0o3qeva1c4l7ao.apps.googleusercontent.com
