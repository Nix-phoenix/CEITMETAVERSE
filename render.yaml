services:
  - type: web
    name: ceitmetaverse-9
    branch: vresion-2.1
    runtime: node
    buildCommand: cd Script/DataBase && npm install && npx prisma generate --schema=./prisma/schema.prisma
    startCommand: cd Script/DataBase && npx prisma migrate deploy --schema=./prisma/schema.prisma && node sever.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGIN
        value: https://ceitmetaverse-9.onrender.com
