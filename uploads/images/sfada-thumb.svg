<svg xmlns="http://www.w3.org/2000/svg" width="400" height="260" viewBox="0 0 400 260">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0e00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a1500;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9f0a;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#ff453a;stop-opacity:0.6" />
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="18" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="260" fill="url(#bg)" rx="12"/>

  <!-- Glow -->
  <circle cx="200" cy="110" r="80" fill="url(#glow)" filter="url(#blur)" opacity="0.4"/>

  <!-- Grid lines -->
  <g stroke="#ff9f0a" stroke-width="0.4" opacity="0.12">
    <line x1="0" y1="65" x2="400" y2="65"/>
    <line x1="0" y1="130" x2="400" y2="130"/>
    <line x1="0" y1="195" x2="400" y2="195"/>
    <line x1="100" y1="0" x2="100" y2="260"/>
    <line x1="200" y1="0" x2="200" y2="260"/>
    <line x1="300" y1="0" x2="300" y2="260"/>
  </g>

  <!-- Diamond icon -->
  <polygon points="200,46 228,80 200,114 172,80"
           fill="none" stroke="#ff9f0a" stroke-width="2" opacity="0.9"/>
  <polygon points="200,54 222,80 200,106 178,80"
           fill="#ff9f0a" opacity="0.15"/>
  <!-- Compass inside -->
  <circle cx="200" cy="80" r="14" fill="none" stroke="#ff9f0a" stroke-width="1.5"/>
  <polygon points="200,68 203,78 200,88 197,78" fill="#ff9f0a" opacity="0.9"/>
  <polygon points="200,68 203,78 200,88 197,78" fill="#ff453a" transform="rotate(180,200,80)" opacity="0.7"/>
  <circle cx="200" cy="80" r="2.5" fill="#ff9f0a"/>

  <!-- Title -->
  <text x="200" y="138" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700"
        fill="#f5f5f7" text-anchor="middle" letter-spacing="1">SFADA Game</text>

  <!-- Subtitle -->
  <text x="200" y="160" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400"
        fill="#86868b" text-anchor="middle">SFADA Virtual World</text>

  <!-- Tags -->
  <rect x="117" y="178" width="52" height="20" rx="10" fill="#ff9f0a" opacity="0.2"/>
  <text x="143" y="192" font-family="Inter, Arial, sans-serif" font-size="10" fill="#ff9f0a" text-anchor="middle">unity</text>

  <rect x="177" y="178" width="70" height="20" rx="10" fill="#ff9f0a" opacity="0.2"/>
  <text x="212" y="192" font-family="Inter, Arial, sans-serif" font-size="10" fill="#ff9f0a" text-anchor="middle">exploration</text>

  <rect x="255" y="178" width="36" height="20" rx="10" fill="#ff9f0a" opacity="0.2"/>
  <text x="273" y="192" font-family="Inter, Arial, sans-serif" font-size="10" fill="#ff9f0a" text-anchor="middle">3d</text>

  <!-- Bottom bar -->
  <rect x="0" y="232" width="400" height="28" fill="#ff9f0a" opacity="0.1"/>
  <text x="200" y="250" font-family="Inter, Arial, sans-serif" font-size="11" fill="#ff9f0a"
        text-anchor="middle" opacity="0.8">CEIT METAVERSE AND GAME</text>
</svg>
