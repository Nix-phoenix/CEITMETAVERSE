<svg xmlns="http://www.w3.org/2000/svg" width="400" height="260" viewBox="0 0 400 260">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d2a4a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0071e3;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#00c8ff;stop-opacity:0.6" />
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="18" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="260" fill="url(#bg)" rx="12"/>

  <!-- Glowing circle backdrop -->
  <circle cx="200" cy="110" r="80" fill="url(#glow)" filter="url(#blur)" opacity="0.5"/>

  <!-- Grid lines -->
  <g stroke="#0071e3" stroke-width="0.4" opacity="0.15">
    <line x1="0" y1="65" x2="400" y2="65"/>
    <line x1="0" y1="130" x2="400" y2="130"/>
    <line x1="0" y1="195" x2="400" y2="195"/>
    <line x1="100" y1="0" x2="100" y2="260"/>
    <line x1="200" y1="0" x2="200" y2="260"/>
    <line x1="300" y1="0" x2="300" y2="260"/>
  </g>

  <!-- Hexagon icon -->
  <polygon points="200,48 228,64 228,96 200,112 172,96 172,64"
           fill="none" stroke="#0071e3" stroke-width="2" opacity="0.9"/>
  <polygon points="200,56 222,68 222,92 200,104 178,92 178,68"
           fill="#0071e3" opacity="0.2"/>
  <!-- VR headset icon inside hex -->
  <rect x="188" y="72" width="24" height="14" rx="4" fill="#00c8ff" opacity="0.9"/>
  <circle cx="193" cy="79" r="3.5" fill="#0a1628"/>
  <circle cx="207" cy="79" r="3.5" fill="#0a1628"/>
  <line x1="196.5" y1="79" x2="203.5" y2="79" stroke="#00c8ff" stroke-width="1.5"/>

  <!-- Title -->
  <text x="200" y="138" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700"
        fill="#f5f5f7" text-anchor="middle" letter-spacing="1">CEIT Game</text>

  <!-- Subtitle -->
  <text x="200" y="160" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400"
        fill="#86868b" text-anchor="middle">CEIT Metaverse Experience</text>

  <!-- Tags -->
  <rect x="112" y="178" width="52" height="20" rx="10" fill="#0071e3" opacity="0.25"/>
  <text x="138" y="192" font-family="Inter, Arial, sans-serif" font-size="10" fill="#0071e3" text-anchor="middle">unity</text>

  <rect x="172" y="178" width="62" height="20" rx="10" fill="#0071e3" opacity="0.25"/>
  <text x="203" y="192" font-family="Inter, Arial, sans-serif" font-size="10" fill="#0071e3" text-anchor="middle">metaverse</text>

  <rect x="242" y="178" width="60" height="20" rx="10" fill="#0071e3" opacity="0.25"/>
  <text x="272" y="192" font-family="Inter, Arial, sans-serif" font-size="10" fill="#0071e3" text-anchor="middle">education</text>

  <!-- Bottom bar -->
  <rect x="0" y="232" width="400" height="28" rx="0" fill="#0071e3" opacity="0.12"/>
  <text x="200" y="250" font-family="Inter, Arial, sans-serif" font-size="11" fill="#0071e3"
        text-anchor="middle" opacity="0.8">CEIT METAVERSE AND GAME</text>
</svg>
